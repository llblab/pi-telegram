name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Run Windows bus lifecycle probes
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          --test-name-pattern="active profile endpoint|replacement endpoint generation"
          tests/bus.test.ts
      - name: Run Windows outbound voice executable probe
        if: matrix.os == 'windows-latest'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          --test-name-pattern="Windows cmd"
          tests/command-templates.test.ts tests/outbound-voice.test.ts
      - name: Run tests
        run: npm test
      - name: Check package contents
        run: npm run pack:check
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit
