name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }}${{ matrix.shardName }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suite: domains
            shardName: ", domains"
          - os: windows-latest
            suite: domains
            shardName: ", domains"
          - os: macos-26-intel
            suite: domains
            shard: 0
            shardName: ", domains 1/2"
          - os: macos-26-intel
            suite: domains
            shard: 1
            shardName: ", domains 2/2"
          - os: ubuntu-latest
            suite: integration
            integrationShard: 0
            shardName: ", integration 1/4"
          - os: ubuntu-latest
            suite: integration
            integrationShard: 1
            shardName: ", integration 2/4"
          - os: ubuntu-latest
            suite: integration
            integrationShard: 2
            shardName: ", integration 3/4"
          - os: ubuntu-latest
            suite: integration
            integrationShard: 3
            shardName: ", integration 4/4"
          - os: windows-latest
            suite: integration
            integrationShard: 0
            shardName: ", integration 1/4"
          - os: windows-latest
            suite: integration
            integrationShard: 1
            shardName: ", integration 2/4"
          - os: windows-latest
            suite: integration
            integrationShard: 2
            shardName: ", integration 3/4"
          - os: windows-latest
            suite: integration
            integrationShard: 3
            shardName: ", integration 4/4"
          - os: macos-26-intel
            suite: integration
            integrationShard: 0
            shardName: ", integration 1/4"
          - os: macos-26-intel
            suite: integration
            integrationShard: 1
            shardName: ", integration 2/4"
          - os: macos-26-intel
            suite: integration
            integrationShard: 2
            shardName: ", integration 3/4"
          - os: macos-26-intel
            suite: integration
            integrationShard: 3
            shardName: ", integration 4/4"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build distributive
        run: npm run build
      - name: Run typecheck
        run: npm run typecheck
      - name: Run Windows bus lifecycle probes
        if: matrix.os == 'windows-latest' && matrix.suite == 'domains'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --import ./tests/fixtures/canonical-tmpdir.ts
          --test --test-concurrency=1 --test-reporter=spec
          --test-name-pattern="active profile endpoint|replacement endpoint generation|Leader assembly serializes follower provisioning"
          tests/bus.test.ts tests/bus-leader.test.ts
      - name: Run Windows outbound voice executable probe
        if: matrix.os == 'windows-latest' && matrix.suite == 'domains'
        timeout-minutes: 2
        run: >-
          node --experimental-strip-types --test --test-reporter=spec
          --test-name-pattern="Windows cmd|multipart voice calls|scoped follower API calls"
          tests/command-templates.test.ts tests/outbound-voice.test.ts
          tests/bus-follower.test.ts tests/bus-leader.test.ts
      - name: Run domain tests
        if: matrix.os != 'macos-26-intel' && matrix.suite == 'domains'
        run: node scripts/run-ci-tests.mjs domains all
      # Real-process tests run alone, exactly once; the runner also keeps the local Pi CLI on PATH.
      - name: Run real-process tests alone
        if: matrix.os == 'macos-26-intel' && matrix.suite == 'domains' && matrix.shard == 0
        run: node scripts/run-ci-tests.mjs process 0
      - name: Run remaining shard tests one file at a time
        if: matrix.os == 'macos-26-intel' && matrix.suite == 'domains'
        run: node scripts/run-ci-tests.mjs domains ${{ matrix.shard }}
      - name: Run integration name shard
        if: matrix.suite == 'integration'
        run: node scripts/run-ci-tests.mjs integration ${{ matrix.integrationShard }}
      - name: Check package contents
        run: npm run pack:check
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.suite == 'domains'
        run: npm run audit
