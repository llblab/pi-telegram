name: Native lock qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "scripts/probe-native-file-lock.mjs"
      - "scripts/probe-owned-native-lease.mjs"
      - "tests/fixtures/native-file-lock/**"
      - ".github/workflows/native-lock-qualification.yml"

permissions:
  contents: read

concurrency:
  group: native-lock-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: native lock (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]
        node: [22.19.0, 26.8.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      QUALIFICATION_EVIDENCE: native-lock-evidence
    steps:
      - name: Check out qualification source without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up exact Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Record source, runtime and frozen dependency inputs
        run: |
          mkdir -p "$QUALIFICATION_EVIDENCE"
          git rev-parse HEAD > "$QUALIFICATION_EVIDENCE/source-commit.txt"
          node --version > "$QUALIFICATION_EVIDENCE/node-version.txt"
          npm --version > "$QUALIFICATION_EVIDENCE/npm-version.txt"
          cp tests/fixtures/native-file-lock/package.json "$QUALIFICATION_EVIDENCE/package.json"
          cp tests/fixtures/native-file-lock/package-lock.json "$QUALIFICATION_EVIDENCE/package-lock.json"
      - name: Install only the frozen candidate without lifecycle hooks
        timeout-minutes: 5
        run: npm ci --prefix tests/fixtures/native-file-lock --ignore-scripts --bin-links=false --no-fund
      - name: Audit the isolated dependency closure
        timeout-minutes: 2
        run: npm audit --prefix tests/fixtures/native-file-lock --omit=dev --json > "$QUALIFICATION_EVIDENCE/audit.json"
      - name: Verify registry signatures and supplied attestations
        timeout-minutes: 2
        run: npm audit signatures --prefix tests/fixtures/native-file-lock --json > "$QUALIFICATION_EVIDENCE/signature-audit.json"
      - name: Qualify actual native behavior in disposable storage
        timeout-minutes: 2
        run: |
          set +e
          node scripts/probe-native-file-lock.mjs --addon tests/fixtures/native-file-lock/node_modules/fs-native-extensions > "$QUALIFICATION_EVIDENCE/report.json" 2> "$QUALIFICATION_EVIDENCE/probe.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$QUALIFICATION_EVIDENCE/exit-code.txt"
          while IFS= read -r line; do printf '%s\n' "$line"; done < "$QUALIFICATION_EVIDENCE/report.json"
          while IFS= read -r line; do printf '%s\n' "$line" >&2; done < "$QUALIFICATION_EVIDENCE/probe.stderr"
          exit "$status"
      - name: Qualify Linux and Darwin environment-owned lease fixture
        if: runner.os == 'Linux' || runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          build="$RUNNER_TEMP/owned-lease-prototype"
          mkdir -p "$build"
          include="$(node -p 'require("node:path").join(require("node:path").dirname(process.execPath), "..", "include", "node")')"
          test -f "$include/node_api.h"
          cc --version > "$QUALIFICATION_EVIDENCE/owned-lease-compiler.txt"
          flags=(-std=c11 -fPIC -Wall -Wextra -Werror -DNAPI_VERSION=8 -I "$include")
          if [ "$RUNNER_OS" = macOS ]; then flags+=(-bundle -undefined dynamic_lookup); else flags+=(-shared); fi
          cc "${flags[@]}" tests/fixtures/native-file-lock/owned-lease.c -o "$build/owned-lease.node"
          cc "${flags[@]}" -DOWNED_LEASE_SUPPRESS_TEARDOWN=1 tests/fixtures/native-file-lock/owned-lease.c -o "$build/without-teardown.node"
          node --input-type=module -e 'import{createHash}from"node:crypto";import{readFileSync}from"node:fs";for(const path of process.argv.slice(1))console.log(createHash("sha256").update(readFileSync(path)).digest("hex")+"  "+path)' tests/fixtures/native-file-lock/owned-lease.c scripts/probe-owned-native-lease.mjs "$build/owned-lease.node" > "$QUALIFICATION_EVIDENCE/owned-lease-inputs.txt"
          set +e
          node scripts/probe-owned-native-lease.mjs --addon "$build/owned-lease.node" > "$QUALIFICATION_EVIDENCE/owned-lease-report.json" 2> "$QUALIFICATION_EVIDENCE/owned-lease.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$QUALIFICATION_EVIDENCE/owned-lease-exit-code.txt"
          while IFS= read -r line; do printf '%s\n' "$line" >&2; done < "$QUALIFICATION_EVIDENCE/owned-lease.stderr"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          set +e
          node scripts/probe-owned-native-lease.mjs --addon "$build/without-teardown.node" > "$QUALIFICATION_EVIDENCE/owned-lease-control.stdout" 2> "$QUALIFICATION_EVIDENCE/owned-lease-control.stderr"
          status=$?
          set -e
          printf '%s\n' "$status" > "$QUALIFICATION_EVIDENCE/owned-lease-control-exit-code.txt"
          test "$status" -eq 1
          grep -Fq 'Actual Worker exit, not a stop request or JS finally, precedes reacquisition' "$QUALIFICATION_EVIDENCE/owned-lease-control.stderr"
      - name: Preserve qualification and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-lock-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_attempt }}
          path: native-lock-evidence
          if-no-files-found: error
          retention-days: 14
