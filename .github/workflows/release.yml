name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Preflight exact tag, package, and changelog
        id: preflight
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, readFileSync, writeFileSync } from "node:fs";

          const tagName = process.env.TAG_NAME;
          if (!tagName || !/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tagName)) {
            throw new Error(`Invalid release tag: ${tagName ?? "missing"}.`);
          }
          if (process.env.GITHUB_REF !== `refs/tags/${tagName}`) {
            throw new Error(`Release checkout must use refs/tags/${tagName}, received ${process.env.GITHUB_REF ?? "missing"}.`);
          }

          const git = (...args) => execFileSync("git", args, { encoding: "utf8" }).trim();
          const headCommit = git("rev-parse", "HEAD^{commit}");
          const tagCommit = git("rev-parse", `refs/tags/${tagName}^{commit}`);
          const eventCommit = process.env.GITHUB_SHA
            ? git("rev-parse", `${process.env.GITHUB_SHA}^{commit}`)
            : "";
          if (headCommit !== tagCommit || eventCommit !== tagCommit) {
            throw new Error(`Release checkout is not the immutable tag commit: head=${headCommit} tag=${tagCommit} event=${eventCommit || "missing"}.`);
          }

          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const version = tagName.slice(1);
          if (packageJson.version !== version) {
            throw new Error(`Tag ${tagName} does not match package.json version ${packageJson.version}.`);
          }
          if (packageLock.version !== version || packageLock.packages?.[""]?.version !== version) {
            throw new Error(`Tag ${tagName} does not match package-lock.json version metadata.`);
          }

          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const pattern = new RegExp(`^##\\s+(${escapedVersion}(?:[^\\n]*)?)\\n([\\s\\S]*?)(?=^##\\s+|(?![\\s\\S]))`, "m");
          const match = changelog.match(pattern);
          if (!match) throw new Error(`CHANGELOG.md has no section for ${version}.`);
          const title = match[1].trim();
          const notes = match[2].trim();
          if (!notes) throw new Error(`CHANGELOG.md section for ${version} is empty.`);
          if (!process.env.GITHUB_OUTPUT) throw new Error("Missing GITHUB_OUTPUT.");
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ntag_commit=${tagCommit}\n`);
          writeFileSync("release-title.txt", `${title}\n`);
          writeFileSync("release-notes.md", `${notes}\n`);
          NODE
      - name: Verify npm supports Trusted Publisher
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = version.split(".").map(Number);
          if (
            !Number.isInteger(major) ||
            major < 11 ||
            (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
          ) {
            throw new Error(`npm ${version} cannot use Trusted Publisher; require npm >= 11.5.1.`);
          }
          console.log(`npm ${version} supports Trusted Publisher.`);
          NODE
      - name: Install exact dependencies
        run: npm ci
      - name: Resolve npm publication state
        id: npm-state
        env:
          PACKAGE_NAME: "@llblab/pi-telegram"
          TAG_COMMIT: ${{ steps.preflight.outputs.tag_commit }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          set +e
          npm view "$PACKAGE_NAME@$VERSION" --json version gitHead > npm-existing.json 2> npm-existing.err
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const published = JSON.parse(readFileSync("npm-existing.json", "utf8"));
          if (published.version !== process.env.VERSION || published.gitHead !== process.env.TAG_COMMIT) {
            throw new Error(`npm version already exists with contradictory identity: ${JSON.stringify(published)}.`);
          }
          console.log(`npm ${process.env.PACKAGE_NAME}@${process.env.VERSION} already matches ${process.env.TAG_COMMIT}.`);
          NODE
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -Eq 'E404|404 Not Found' npm-existing.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-existing.err >&2
            exit "$status"
          fi
      - name: Publish npm package through Trusted Publisher
        if: steps.npm-state.outputs.publish == 'true'
        run: npm publish --access public --provenance
      - name: Verify public npm package and packed manifest
        env:
          PACKAGE_NAME: "@llblab/pi-telegram"
          TAG_COMMIT: ${{ steps.preflight.outputs.tag_commit }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          verified=false
          # Trusted Publisher may finish before the new version reaches public registry reads.
          for attempt in $(seq 1 120); do
            if npm view "$PACKAGE_NAME@$VERSION" --json version gitHead pi --prefer-online > npm-published.json 2> npm-published.err &&
               npm pack "$PACKAGE_NAME@$VERSION" --dry-run --json --prefer-online > npm-pack.json 2> npm-pack.err &&
               node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const published = JSON.parse(readFileSync("npm-published.json", "utf8"));
          if (published.version !== process.env.VERSION || published.gitHead !== process.env.TAG_COMMIT) {
            throw new Error(`Published npm identity does not match the release tag: ${JSON.stringify(published)}.`);
          }
          if (!published.pi?.extensions?.includes("./dist/pi-telegram/index.js") ||
              !published.pi?.skills?.includes("./dist/skills")) {
            throw new Error("Published npm metadata is missing the built Pi extension or skill manifest.");
          }
          const packed = JSON.parse(readFileSync("npm-pack.json", "utf8"))[0];
          const paths = new Set((packed?.files ?? []).map((file) => file.path));
          if (packed?.name !== process.env.PACKAGE_NAME || packed?.version !== process.env.VERSION ||
              !paths.has("dist/index.js") || !paths.has("dist/index.d.ts") ||
              !paths.has("dist/pi-telegram/index.js") ||
              !paths.has("dist/skills/telegram-bridge/SKILL.md") || !paths.has("package.json")) {
            throw new Error("Published npm tarball is missing the expected built runtime or manifests.");
          }
          NODE
            then
              verified=true
              break
            fi
            sleep 5
          done
          if [ "$verified" != "true" ]; then
            cat npm-published.err npm-pack.err >&2 2>/dev/null || true
            exit 1
          fi
          echo "Verified public npm package $PACKAGE_NAME@$VERSION."
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; updating title and notes."
            gh release edit "$TAG_NAME" \
              --title "$(cat release-title.txt)" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --title "$(cat release-title.txt)" \
              --notes-file release-notes.md \
              --verify-tag
          fi
